version: '3.8'

services:
  knowledge-bridge-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-bridge-ai-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-auto}
    volumes:
      - kb_data:/app/backend/uploads
      - kb_db:/app/data

volumes:
  kb_data:
  kb_db:

